<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="script.js"></script>
    <script src="rocket.js"></script>
    <script src="ufo.js"></script>
    <script src="car.js"></script>
  </head>
  <body>
      <a-scene>
        <!-- Challenge 1: Add a propriate plane and sky for the missile launch site -->
       <a-assets>
        <img id="bg" src="sky.jpg"/>
        <img id="wall" src="Wall.jpg"/>
        <img id="woodplank" src="plank.jpg">
        <img id="roof" src="roof.jpg">
      </a-assets>

  
        
      <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="black"></a-plane>
        <a-sky src="skyy.jpg" repeat="5 5"></a-sky>
      <!-- Camera is added so that you do not "spawn" at the origin -->
      <a-camera position="0 7 -75"></a-camera>
    </a-scene>
  </body>
</html>
